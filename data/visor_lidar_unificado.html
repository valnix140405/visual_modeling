<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorador de Relieve 3D — Mérida</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --white: #ffffff;
      --purple: #600d8b;
      --gold: #ed9f22;
      --text: #0d0d0d;
      --muted: #555555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    .hud-top-left {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: var(--white);
      color: var(--text);
      border-left: 6px solid var(--purple);
      border-radius: 14px;
      padding: 16px 18px;
      max-width: 390px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
    }
    .badge {
      display: inline-block;
      background: var(--purple);
      color: var(--white);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .mode-btn {
      background: #f5f3f7;
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.2;
    }
    .mode-btn.active {
      background: var(--purple);
      color: var(--white);
      border-color: var(--gold);
    }
    h1 { font-size: 18px; line-height: 1.25; margin-bottom: 6px; }
    .subtitle { font-size: 13px; line-height: 1.45; color: var(--muted); margin-bottom: 12px; }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-box {
      background: #f5f3f7;
      border-radius: 8px;
      padding: 8px;
      border-bottom: 3px solid var(--gold);
    }
    .stat-val { font-size: 14px; font-weight: 800; color: var(--purple); }
    .stat-lbl { font-size: 10px; color: var(--muted); }
    .sub-controls {
      background: #fff9ef;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .ctrl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      gap: 8px;
    }
    input[type="range"] { width: 55%; accent-color: var(--purple); cursor: pointer; }
    .pill-group { display: flex; gap: 6px; margin-top: 6px; }
    .pill {
      flex: 1;
      border: 1px solid var(--purple);
      background: var(--white);
      color: var(--purple);
      border-radius: 6px;
      padding: 5px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .pill.active { background: var(--purple); color: var(--white); }

    .hud-top-right { position: fixed; top: 16px; right: 16px; z-index: 10; }
    .btn-back {
      display: inline-block;
      background: var(--white);
      color: var(--purple);
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 2px solid var(--purple);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .btn-back:hover { background: var(--purple); color: var(--white); }

    .profile-card {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: var(--white);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      width: 390px;
      border-top: 4px solid var(--gold);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .profile-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--purple);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    #profile-canvas { width: 100%; height: 135px; display: block; }
    @media (max-width: 720px) {
      .hud-top-left { max-width: calc(100vw - 32px); top: 62px; }
      .profile-card { width: calc(100vw - 32px); right: 16px; bottom: 12px; }
    }
      .pending-box {
      background: #fff1f2; border: 1px solid #dc2626; color: #7f1d1d;
      border-radius: 8px; padding: 10px 12px; font-size: 12.5px; font-weight: 700; line-height: 1.45;
    }
    .note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; color: #ffffff; font-weight: 800; pointer-events: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="loading"></div>

  <div class="hud-top-right">
    <a href="../index.html" class="btn-back">Volver a la Presentación</a>
  </div>

  <div class="hud-top-left">
    <span class="badge">Explorador de Relieve 3D (elevación real)</span>
    <div class="mode-tabs">
      <button class="mode-btn" data-mode="a" onclick="switchMode('a')">08-A · Domo LiDAR</button>
      <button class="mode-btn" data-mode="b" onclick="switchMode('b')">08-B · Centro</button>
      <button class="mode-btn" data-mode="c" onclick="switchMode('c')">08-C · Mérida 17 km</button>
    </div>

    <h1 id="mode-title"></h1>
    <p class="subtitle" id="mode-desc"></p>

    <div class="stats-row" id="stats-row"></div>
    <div class="sub-controls" id="sub-controls">
      <div class="ctrl-row">
        <span>Exageración vertical: <span id="exag-val"></span></span>
        <input type="range" id="exag" min="1" max="300" step="1" oninput="setExag(this.value)">
      </div>
      <div class="note" id="exag-note"></div>
    </div>
  </div>

  <div class="profile-card" id="profile-card">
    <div class="profile-title">
      <span id="chart-title">Perfil oeste → este (altura real, sin exagerar)</span>
      <span id="chart-sub"></span>
    </div>
    <canvas id="profile-canvas" width="700" height="250"></canvas>
  </div>

  <script>
    const MODES = {
      a: {
        title: 'LiDAR del domo del Mercado Lucas de Gálvez',
        desc: 'No contamos con un levantamiento LiDAR real del mercado. La nube de 20 puntos que había aquí era simulada y se eliminó.',
        pending: true
      },
      b: {
        title: 'Elevación del Centro alrededor del Mercado Lucas de Gálvez',
        desc: 'Malla real de 41 x 41 puntos (1.6 km por lado) centrada en el mercado (punto dorado). Fuente: AWS Terrain Tiles (Tilezen), elevación en metros sobre el nivel del mar.',
        file: './fuente_b/08_lidar_cem_mde/elevacion_centro_merida.ply',
        exag: 40
      },
      c: {
        title: 'Relieve de Mérida: 17 km x 17 km',
        desc: 'Malla real de 50 x 50 puntos sobre la ciudad. Fuente: AWS Terrain Tiles (Tilezen). Mérida es tan plana que sin exageración la superficie se ve como una hoja.',
        file: './fuente_c/08_opentopography/relieve_merida_terrain_tiles.ply',
        exag: 150
      }
    };

    // ---------- escena
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    let current = null;          // { mode, pts:[x,y,z,r,g,b], points, marker, zmin, zmax, size }
    const cache = {};

    function parsePly(text) {
      const lines = text.split(/\r?\n/);
      let i = 0, n = 0;
      for (; i < lines.length; i++) {
        const l = lines[i].trim();
        if (l.startsWith('element vertex')) n = parseInt(l.split(/\s+/)[2], 10);
        if (l === 'end_header') { i++; break; }
      }
      const pts = [];
      for (let k = 0; k < n && i + k < lines.length; k++) {
        const v = lines[i + k].trim().split(/\s+/).map(Number);
        if (v.length >= 6) pts.push(v);
      }
      return pts;
    }

    async function loadMode(m) {
      if (cache[m]) return cache[m];
      const r = await fetch(MODES[m].file);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      cache[m] = parsePly(await r.text());
      return cache[m];
    }

    function clearScene() {
      if (!current) return;
      if (current.points) { scene.remove(current.points); current.points.geometry.dispose(); }
      if (current.marker) scene.remove(current.marker);
      current = null;
    }

    function buildCloud(m, pts) {
      let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity, zmin = Infinity, zmax = -Infinity;
      for (const p of pts) {
        xmin = Math.min(xmin, p[0]); xmax = Math.max(xmax, p[0]);
        ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]);
        zmin = Math.min(zmin, p[2]); zmax = Math.max(zmax, p[2]);
      }
      const cx = (xmin + xmax) / 2, cy = (ymin + ymax) / 2, size = Math.max(xmax - xmin, ymax - ymin);
      const pos = new Float32Array(pts.length * 3), col = new Float32Array(pts.length * 3);
      pts.forEach((p, k) => {
        pos[3 * k] = p[0] - cx; pos[3 * k + 1] = 0; pos[3 * k + 2] = -(p[1] - cy);
        col[3 * k] = p[3] / 255; col[3 * k + 1] = p[4] / 255; col[3 * k + 2] = p[5] / 255;
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({ size: size / 120, vertexColors: true });
      const points = new THREE.Points(g, mat);
      scene.add(points);
      let marker = null;
      if (m === 'b') {
        marker = new THREE.Mesh(new THREE.SphereGeometry(size / 70, 16, 16), new THREE.MeshBasicMaterial({ color: 0xed9f22 }));
        scene.add(marker);
      }
      current = { mode: m, pts, points, marker, zmin, zmax, size, cx, cy };
      camera.position.set(size * 0.55, size * 0.6, size * 0.95);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    function setExag(v) {
      v = Number(v);
      document.getElementById('exag-val').textContent = '×' + v;
      document.getElementById('exag-note').textContent = v === 1
        ? 'Escala real: la altura se muestra igual que en el terreno.'
        : 'La altura se muestra ' + v + ' veces mayor que la real para que el relieve sea visible. Las cifras de esta tarjeta y el perfil usan la altura real.';
      if (!current || !current.points) return;
      const pos = current.points.geometry.attributes.position;
      current.pts.forEach((p, k) => pos.setY(k, (p[2] - current.zmin) * v));
      pos.needsUpdate = true;
      if (current.marker) {
        // punto central de la malla = coordenada del mercado
        const mid = current.pts[Math.floor(current.pts.length / 2)];
        current.marker.position.set(mid[0] - current.cx, (mid[2] - current.zmin) * v + current.size / 60, -(mid[1] - current.cy));
      }
    }

    function drawProfile(pts) {
      const cv = document.getElementById('profile-canvas'), ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);
      const ys = [...new Set(pts.map(p => p[1].toFixed(1)))].map(Number).sort((a, b) => a - b);
      const yMid = ys[Math.floor(ys.length / 2)];
      const row = pts.filter(p => Math.abs(p[1] - yMid) < 1e-6 || p[1].toFixed(1) === yMid.toFixed(1)).sort((a, b) => a[0] - b[0]);
      if (row.length < 2) return;
      const zs = row.map(p => p[2]); const zmin = Math.min(...zs), zmax = Math.max(...zs);
      const L = 56, R = 16, T = 16, B = 40, W = cv.width - L - R, H = cv.height - T - B;
      const X = x => L + (x - row[0][0]) / (row[row.length - 1][0] - row[0][0]) * W;
      const Y = z => T + H - (z - zmin) / ((zmax - zmin) || 1) * H;
      ctx.strokeStyle = '#e2e8f0'; ctx.fillStyle = '#555555'; ctx.font = '20px Segoe UI, sans-serif';
      [zmin, (zmin + zmax) / 2, zmax].forEach(z => {
        ctx.beginPath(); ctx.moveTo(L, Y(z)); ctx.lineTo(L + W, Y(z)); ctx.stroke();
        ctx.fillText(z.toFixed(1) + ' m', 0, Y(z) + 6);
      });
      ctx.fillText('0 km', L, cv.height - 10);
      const km = (row[row.length - 1][0] - row[0][0]) / 1000;
      ctx.fillText(km.toFixed(1) + ' km', L + W - 60, cv.height - 10);
      ctx.strokeStyle = '#600d8b'; ctx.lineWidth = 4; ctx.beginPath();
      row.forEach((p, k) => k ? ctx.lineTo(X(p[0]), Y(p[2])) : ctx.moveTo(X(p[0]), Y(p[2])));
      ctx.stroke();
      document.getElementById('chart-sub').textContent = row.length + ' puntos reales';
    }

    function stat(v, l) { return '<div class="stat-box"><div class="stat-val">' + v + '</div><div class="stat-lbl">' + l + '</div></div>'; }

    async function switchMode(m) {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      const cfg = MODES[m];
      document.getElementById('mode-title').textContent = cfg.title;
      document.getElementById('mode-desc').textContent = cfg.desc;
      clearScene();
      const stats = document.getElementById('stats-row'), ctrls = document.getElementById('sub-controls'), prof = document.getElementById('profile-card');
      if (cfg.pending) {
        stats.innerHTML = '';
        stats.style.display = 'none';
        ctrls.style.display = 'none';
        prof.style.display = 'none';
        document.getElementById('mode-desc').insertAdjacentHTML('afterend', '');
        stats.insertAdjacentHTML('beforebegin', '');
        document.getElementById('loading').textContent = '';
        document.getElementById('mode-desc').innerHTML = cfg.desc + '<br><br><span class="pending-box" style="display:block">Pendiente: sin dato real disponible.</span>';
        return;
      }
      stats.style.display = ''; ctrls.style.display = ''; prof.style.display = '';
      document.getElementById('loading').textContent = 'Cargando malla de elevación…';
      try {
        const pts = await loadMode(m);
        buildCloud(m, pts);
        document.getElementById('loading').textContent = '';
        stats.innerHTML = stat(pts.length.toLocaleString('es-MX'), 'puntos reales') +
          stat(current.zmin.toFixed(1) + ' m', 'elevación mínima') +
          stat(current.zmax.toFixed(1) + ' m', 'elevación máxima');
        const ex = document.getElementById('exag'); ex.value = cfg.exag; setExag(cfg.exag);
        drawProfile(pts);
      } catch (e) {
        document.getElementById('loading').textContent = 'No se pudo cargar el archivo .ply (' + e.message + '). Abre el visor desde un servidor web, no con doble clic.';
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

    const params = new URLSearchParams(location.search);
    switchMode(MODES[params.get('modo')] ? params.get('modo') : 'b');
  </script>
</body>
</html>
